<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="100%" stop-color="#111420" />
    </linearGradient>
    <linearGradient id="needle-grad" x1="20" y1="8" x2="20" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#FF5200" />
    </linearGradient>
  </defs>
  <!-- Deep Space Squircle Base -->
  <rect x="1" y="1" width="38" height="38" rx="10" fill="url(#logo-bg)" stroke="#FF9E00" stroke-width="1.4" />
  <!-- Gauge Arc (Photon Ring) -->
  <path d="M10 28a14 14 0 0 1 20 0" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25" />
  <path d="M10 28a14 14 0 0 1 20 0" stroke="#FF9E00" stroke-width="2.5" stroke-linecap="round" fill="none" stroke-dasharray="44" stroke-dashoffset="11" />
  <!-- Tick Marks -->
  <line x1="10" y1="28" x2="12" y2="26" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <line x1="15" y1="18" x2="16.5" y2="19.5" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <line x1="20" y1="15" x2="20" y2="17" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <line x1="25" y1="18" x2="23.5" y2="19.5" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <line x1="30" y1="28" x2="28" y2="26" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <!-- Needle (pointing ~75%) -->
  <line x1="20" y1="28" x2="26" y2="19" stroke="url(#needle-grad)" stroke-width="2.2" stroke-linecap="round" />
  <!-- Center Pivot -->
  <circle cx="20" cy="28" r="2.5" fill="#FF9E00" />
  <circle cx="20" cy="28" r="1.2" fill="#08090E" />
  <!-- Prompt Chevrons (Pulsar Cyan) -->
  <path d="M7 10l-2.5 2.5L7 15" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M33 10l2.5 2.5L33 15" stroke="#00E5FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
</svg>
