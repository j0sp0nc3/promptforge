[project]
name = "promptometer-core"
version = "1.2.0"
description = "Zero-dependency prompt evaluation engine — scores, anti-patterns, adversarial tests, rewrites and agent task assessment."
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "j0sp0nc3" }]
keywords = [
    "prompt",
    "llm",
    "evaluation",
    "scoring",
    "prompt-engineering",
    "agentic",
    "promptometer",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
promptometer = "promptometer_core:main"

[project.urls]
Homepage = "https://github.com/j0sp0nc3/promptometer"
Repository = "https://github.com/j0sp0nc3/promptometer"
Issues = "https://github.com/j0sp0nc3/promptometer/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["promptometer_core"]
